create or replace function public.set_updated_at() returns trigger language plpgsql as $$
begin new.updated_at=now(); return new; end $$;

create or replace function public.my_store_id() returns uuid language sql stable security definer set search_path=public as $$
  select store_id from public.profiles where id=auth.uid()
$$;
create or replace function public.is_superadmin() returns boolean language sql stable security definer set search_path=public as $$
  select exists(select 1 from public.profiles where id=auth.uid() and role='superadmin' and status='active')
$$;
create or replace function public.is_store_admin(target_store uuid) returns boolean language sql stable security definer set search_path=public as $$
  select exists(select 1 from public.profiles where id=auth.uid() and role='admin' and status='active' and store_id=target_store)
$$;

-- Allows a newly authenticated staff user to resolve an existing store by exact name without exposing all store data.
create or replace function public.find_store_for_registration(p_store_name text)
returns table(id uuid, store_name text) language sql security definer set search_path=public as $$
  select s.id,s.store_name from public.pharmacy_stores s
  where lower(trim(s.store_name))=lower(trim(p_store_name))
  order by s.created_at asc limit 1
$$;
grant execute on function public.find_store_for_registration(text) to anon, authenticated;

-- Atomic POS transaction: creates the sale, checks every stock quantity, deducts stock and creates sale items in one transaction.
create or replace function public.complete_sale(
  p_store_id uuid,p_invoice_number text,p_customer_name text,p_customer_phone text,p_payment_mode public.payment_mode,
  p_subtotal numeric,p_discount numeric,p_cgst numeric,p_sgst numeric,p_gst_total numeric,p_total numeric,p_items jsonb
) returns public.sales language plpgsql security invoker set search_path=public as $$
declare v_sale public.sales; v_item jsonb; v_stock integer;
begin
  if public.my_store_id()<>p_store_id and not public.is_superadmin() then raise exception 'Not authorized for this store'; end if;
  insert into public.sales(store_id,invoice_number,customer_name,customer_phone,payment_mode,subtotal,discount,cgst,sgst,gst_total,total,created_by)
  values(p_store_id,p_invoice_number,p_customer_name,p_customer_phone,p_payment_mode,p_subtotal,p_discount,p_cgst,p_sgst,p_gst_total,p_total,auth.uid()) returning * into v_sale;
  for v_item in select * from jsonb_array_elements(p_items) loop
    update public.inventory set quantity=quantity-(v_item->>'quantity')::integer,updated_at=now()
    where id=(v_item->>'inventory_id')::uuid and store_id=p_store_id and quantity >= (v_item->>'quantity')::integer
    returning quantity into v_stock;
    if not found then raise exception 'Insufficient stock or stock changed for %',v_item->>'medicine_name'; end if;
    insert into public.sale_items(sale_id,inventory_id,medicine_name,batch_number,quantity,unit_price,gst_percent,line_total)
    values(v_sale.id,(v_item->>'inventory_id')::uuid,v_item->>'medicine_name',v_item->>'batch_number',(v_item->>'quantity')::integer,(v_item->>'unit_price')::numeric,(v_item->>'gst_percent')::numeric,(v_item->>'line_total')::numeric);
  end loop;
  return v_sale;
end $$;

-- Adds one strike and enforces the requested policy: strikes 1-2 temporary block, strike 3 permanent block.
create or replace function public.add_violation(p_profile_id uuid,p_reason text)
returns public.profiles language plpgsql security invoker set search_path=public as $$
declare v_profile public.profiles; v_next integer; v_status public.account_status; v_action text;
begin
  select * into v_profile from public.profiles where id=p_profile_id for update;
  if not found then raise exception 'Profile not found'; end if;
  if not (public.is_superadmin() or public.is_store_admin(v_profile.store_id)) then raise exception 'Not authorized'; end if;
  v_next:=coalesce(v_profile.violation_count,0)+1;
  if v_next>=3 then v_status:='permanent_blocked'; v_action:='Permanent block';
  else v_status:='temporary_blocked'; v_action:='Temporary block'; end if;
  update public.profiles set violation_count=v_next,last_violation_reason=p_reason,blocked_at=now(),blocked_until=case when v_next<3 then now()+interval '7 days' else null end,status=v_status where id=p_profile_id returning * into v_profile;
  insert into public.violations(profile_id,store_id,reported_by,reason,strike_number,action_taken) values(p_profile_id,v_profile.store_id,auth.uid(),p_reason,v_next,v_action);
  return v_profile;
end $$;

create or replace function public.restore_profile(p_profile_id uuid,p_clear_strikes boolean default true)
returns public.profiles language plpgsql security invoker set search_path=public as $$
declare v_profile public.profiles;
begin
  select * into v_profile from public.profiles where id=p_profile_id for update;
  if not found then raise exception 'Profile not found'; end if;
  if not (public.is_superadmin() or public.is_store_admin(v_profile.store_id)) then raise exception 'Not authorized'; end if;
  update public.profiles set status='active',violation_count=case when p_clear_strikes then 0 else violation_count end,last_violation_reason=case when p_clear_strikes then null else last_violation_reason end,blocked_at=null,blocked_until=null,approved_by=auth.uid(),approved_at=now() where id=p_profile_id returning * into v_profile;
  return v_profile;
end $$;

  /* ================= AUTH + ONE DEVICE SESSION ================= */
  let deviceSessionTimer=null;
  let deviceSessionId=null;
  let sessionEndedByOtherDevice=false;

  function deviceLabel(){
    const ua=navigator.userAgent||"";
    const browser=/Edg\//i.test(ua)?"Edge":/Chrome\//i.test(ua)?"Chrome":/Firefox\//i.test(ua)?"Firefox":/Safari\//i.test(ua)?"Safari":"Browser";
    const os=/Windows/i.test(ua)?"Windows":/Android/i.test(ua)?"Android":/iPhone|iPad/i.test(ua)?"iPhone/iPad":/Mac/i.test(ua)?"Mac":/Linux/i.test(ua)?"Linux":"Device";
    return `${browser} / ${os}`;
  }

  async function claimDeviceSession(force=false){
    const r=await sb.rpc("claim_device_session",{p_device_label:deviceLabel(),p_force:force});
    if(r.error)throw r.error;
    return r.data?.[0]||null;
  }

  function stopDeviceSessionControl(){
    if(deviceSessionTimer){clearInterval(deviceSessionTimer);deviceSessionTimer=null;}
    deviceSessionId=null;
  }

  function startDeviceSessionControl(){
    stopDeviceSessionControl();
    if(!state.session?.user)return;
    deviceSessionTimer=setInterval(async()=>{
      try{
        if(!state.session?.user){stopDeviceSessionControl();return;}
        const r=await sb.rpc("touch_device_session");
        if(r.error||r.data!==true)await handleRemoteLogout();
      }catch(err){console.warn("Device session check failed",err);}
    },15000);
  }

  async function releaseDeviceSession(){
    try{if(state.session?.user)await sb.rpc("release_device_session");}catch(err){console.warn("Device session release failed",err);}
    stopDeviceSessionControl();
  }

  async function handleRemoteLogout(){
    if(sessionEndedByOtherDevice)return;
    sessionEndedByOtherDevice=true;
    stopDeviceSessionControl();
    try{await sb.auth.signOut({scope:"local"});}catch(_e){}
    state.session=null;state.me=null;state.store=null;state.inventory=[];state.cart=[];
    showSessionEnded();
  }

  function showSessionEnded(){
    state.authMode="login";
    renderAuthCard();renderConfigBanner();
    const wrap=$("#authCards");
    if(wrap)wrap.innerHTML=`<div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 text-center">

  }

  function showDeviceConflict(device,last){
    return new Promise(resolve=>{
      ensureModalHost();
      const old=document.getElementById("deviceConflictModal");
      if(old)old.remove();
      const host=document.createElement("div");
      host.id="deviceConflictModal";
      host.innerHTML=`<div class="fixed inset-0 z-[9999] bg-slate-950/60 backdrop-blur-sm p-4 flex items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 w-full max-w-md">
          <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-2xl">⚠️</div>
          <h2 class="text-2xl font-black mt-5">Account Already Logged In</h2>
          <p class="text-slate-500 mt-2">This account is currently active on another device.</p>
          <div class="bg-slate-50 rounded-2xl p-4 mt-5 text-sm"><div><b>Device:</b> ${esc(device||"Another device")}</div><div class="mt-1"><b>Last active:</b> ${esc(last||"Recently")}</div></div>
          <p class="text-sm text-slate-600 mt-5">Continue only if you want to log out the previous device and use this device instead.</p>
          <div class="grid grid-cols-2 gap-3 mt-6"><button id="deviceCancel" class="secondary-btn">Cancel</button><button id="deviceContinue" class="primary-btn">Log Out Previous & Continue</button></div>
        </div></div>`;
      document.body.appendChild(host);
      const finish=v=>{host.remove();resolve(v);};
      host.querySelector("#deviceCancel").onclick=()=>finish(false);
      host.querySelector("#deviceContinue").onclick=()=>finish(true);
    });
  }

  async function signup(e){
    e.preventDefault();
    if(!sb)return toast("Connect Supabase first.","error");
    const f=new FormData(e.target),role=String(f.get("role")||"admin"),phone=normalizePhone(f.get("mobile"));
    const email=String(f.get("email")||"").trim().toLowerCase(),password=String(f.get("password")||"");
    if(!/^\+\d{8,15}$/.test(phone))return toast("Enter a valid mobile number, for example +919876543210.","error");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast("Enter a valid email address.","error");
    if(password.length<8)return toast("Password must be at least 8 characters.","error");
    if(password!==String(f.get("confirm")||""))return toast("Passwords do not match.","error");
    if(role==="admin"&&(!f.get("license")||!f.get("license_file")||!f.get("license_file").size))return toast("Admin registration requires drug-license number and file.","error");
    const btn=e.target.querySelector("button[type=submit]");busy(btn,true,"Creating account…");
    try{
      const phoneCheck=await sb.from("profiles").select("id").eq("mobile",phone).maybeSingle();
      if(phoneCheck.error)throw phoneCheck.error;
      if(phoneCheck.data)throw new Error("This mobile number is already registered.");

      const auth=await sb.auth.signUp({email,password,options:{data:{full_name:String(f.get("owner_name")||"").trim(),mobile:phone,role,store_name:String(f.get("store_name")||"").trim()}}});
      if(auth.error)throw auth.error;
      if(!auth.data?.user)throw new Error("Supabase did not create the account.");
      if(!auth.data.session)throw new Error("No session was returned. In Supabase Authentication → Providers → Email, keep Confirm email OFF.");

      state.session=auth.data.session;
      state.pendingSignup={role,storeName:String(f.get("store_name")||"").trim(),ownerName:String(f.get("owner_name")||"").trim(),pharmacistName:String(f.get("pharmacist_name")||"").trim(),phone,email,license:String(f.get("license")||"").trim(),licenseFile:role==="admin"?f.get("license_file"):null,userId:auth.data.user.id};
      await finishVerifiedRegistration(auth.data.user);
    }catch(err){try{await sb.auth.signOut({scope:"local"});}catch(_e){}state.session=null;toast(err?.message||"Registration failed.","error");}
    finally{busy(btn,false);}
  }

  async function finishVerifiedRegistration(user){
    const p=state.pendingSignup;if(!p)throw new Error("Registration data expired. Please create the account again.");
    const live=await sb.auth.getSession();if(live.error)throw live.error;
    if(!live.data?.session?.user?.id)throw new Error("Authentication session is missing. Keep Confirm email OFF in Supabase.");
    state.session=live.data.session;user=live.data.session.user;
    let licensePath=null;
    if(p.role==="admin"&&p.licenseFile&&p.licenseFile.size){
      licensePath=`${user.id}/${Date.now()}_${String(p.licenseFile.name).replace(/[^\w.-]/g,"_")}`;
      const up=await sb.storage.from("licenses").upload(licensePath,p.licenseFile,{upsert:false,contentType:p.licenseFile.type});
      if(up.error)throw up.error;
    }
    const reg=await sb.rpc("register_pharmacy_account",{p_role:p.role,p_store_name:p.storeName,p_owner_name:p.ownerName,p_pharmacist_name:p.pharmacistName,p_mobile:p.phone,p_email:p.email,p_license:p.license,p_license_path:licensePath});
    if(reg.error)throw reg.error;if(!reg.data)throw new Error("Registration function did not return a pharmacy store ID.");
    await sb.auth.signOut({scope:"local"});state.session=null;state.pendingSignup=null;state.pendingEmail=null;state.authMode="login";renderAuthCard();renderConfigBanner();
    toast(p.role==="admin"?"Account created. It is pending Super-Admin review.":"Account created. It is pending Store Admin approval.","success");
  }

  async function login(e){
    e.preventDefault();
    if(!sb)return toast("Connect Supabase first.","error");
    ensureModalHost();
    const f=new FormData(e.target),email=String(f.get("email")||"").trim().toLowerCase(),password=String(f.get("password")||"");
    if(!email)return toast("Email ID is required.","error");
    if(!password)return toast("Password is required.","error");
    const btn=e.target.querySelector("button[type=submit]");busy(btn,true,"Signing in…");
    try{
      const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;
      state.session=r.data.session;await loadIdentity();
      if(!state.me)throw new Error("Profile record is missing. Ask the founder to repair this account.");
      if(state.me.status!=="active"){
        await sb.auth.signOut({scope:"local"});state.session=null;
        const msg=state.me.status==="pending_superadmin"?"Account is pending Super-Admin review.":state.me.status==="pending_store_admin"?"Account is pending Store Admin approval.":state.me.status==="temporary_blocked"?"Account is temporarily blocked.":state.me.status==="permanent_blocked"?"Account is permanently revoked.":"Account access is not active.";
        throw new Error(msg);
      }
      const claimed=await claimDeviceSession(false);
      if(claimed?.previous_device_exists){
        const st=await sb.rpc("device_session_status");
        const row=st.data?.[0];
        const ok=await showDeviceConflict(row?.active_device_label||"Another device",row?.last_seen_at?new Date(row.last_seen_at).toLocaleString("en-IN"):"Recently");
        if(!ok){await sb.auth.signOut({scope:"local"});state.session=null;state.me=null;state.store=null;throw new Error("Login cancelled. The previous device remains logged in.");}
        const takeover=await claimDeviceSession(true);if(!takeover?.claimed_session_id)throw new Error("Could not take control of this device session.");
        deviceSessionId=takeover.claimed_session_id;
      }else deviceSessionId=claimed?.claimed_session_id||null;
      sessionEndedByOtherDevice=false;startDeviceSessionControl();await startApp();
    }catch(err){toast(err?.message||"Sign in failed.","error");}
    finally{busy(btn,false);}
  }

  async function loadIdentity(){
    if(!state.session?.user)return;
    const p=await sb.from("profiles").select("*").eq("id",state.session.user.id).maybeSingle();
    if(p.error)throw p.error;
    state.me=p.data||null;
    state.store=null;
    if(state.me?.store_id){
      const s=await sb.from("pharmacy_stores").select("*").eq("id",state.me.store_id).single();
      if(s.error)throw s.error;
      state.store=s.data;
    }
  }

  async function boot(){
    try{
      renderAuth();
      if(!validConfig())return;
      if(!window.supabase||typeof window.supabase.createClient!=="function")throw new Error("Supabase CDN did not load. Check your internet connection.");
      sb=window.supabase.createClient(SUPABASE_URL.trim(),SUPABASE_ANON_KEY.trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
      const hash=new URLSearchParams(window.location.hash.replace(/^#/,""));
      const authError=hash.get("error_description");
      if(authError){
        window.history.replaceState({},document.title,window.location.pathname+window.location.search);
        toast(decodeURIComponent(authError),"error");
      }
      const g=await sb.auth.getSession();
      if(g.error)throw g.error;
      sb.auth.onAuthStateChange((event,s)=>{
        if(event==="SIGNED_OUT"){stopDeviceSessionControl();state.session=null;}
      });
      if(g.data?.session){
        state.session=g.data.session;
        await loadIdentity();
        if(state.me?.status==="active"){
          const claimed=await claimDeviceSession(false);
          if(claimed?.previous_device_exists){
            await handleRemoteLogout();
          }else{
            deviceSessionId=claimed?.claimed_session_id||null;
            startDeviceSessionControl();
            await startApp();
          }
        }else if(state.me){
          await sb.auth.signOut({scope:"local"});state.session=null;toast(statusLabel(state.me.status),"info");
        }else{
          await sb.auth.signOut({scope:"local"});state.session=null;
          toast("Registration is incomplete. Please create the account again.","info");
        }
      }
    }catch(err){
      console.error(err);renderAuth();renderConfigBanner();toast(err?.message||"Application initialization failed.","error");
    }
  }

  async function uploadPrescription(e){

  async function backupStore(){
    const tables=["pharmacy_stores","profiles","inventory","purchases","purchase_items","sales","sale_items","expenses","bugs","violations","drafts"];
    const out={exported_at:new Date().toISOString(),store_id:state.store.id,tables:{}};
    for(const t of tables){const r=await sb.from(t).select("*").eq("store_id",state.store.id);if(r.error)continue;out.tables[t]=r.data||[];}
    const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MAAJ_ERP_BACKUP_"+today()+".json";a.click();URL.revokeObjectURL(a.href);
    toast("Backup downloaded from Supabase.","success");

  async function preprocessPurchaseImage(file){
    return await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onerror=()=>reject(new Error("Could not read the bill image."));
      reader.onload=()=>{
        const img=new Image();
        img.onerror=()=>reject(new Error("Could not open the bill image."));
        img.onload=()=>{
          const maxW=2200,maxH=3200,scale=Math.min(2.5,Math.max(1,Math.min(maxW/img.width,maxH/img.height)));
          const w=Math.max(900,Math.round(img.width*scale)),h=Math.round(img.height*(w/img.width));
          const c=document.createElement("canvas");c.width=w;c.height=h;
          const ctx=c.getContext("2d",{willReadFrequently:true});
          ctx.drawImage(img,0,0,w,h);
          const data=ctx.getImageData(0,0,w,h),d=data.data;
          for(let i=0;i<d.length;i+=4){
            const lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
            const v=lum>205?255:(lum<105?0:Math.round((lum-105)*255/100));
            d[i]=d[i+1]=d[i+2]=v;
          }
          ctx.putImageData(data,0,0);
          c.toBlob(blob=>blob?resolve(blob):reject(new Error("Could not prepare the bill image.")),"image/png",1);
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    if(key==="notifications")return simpleFeatureView(key,"Notifications","Operational alerts for low stock, expiry, payment and account events.",`<section class="bg-white rounded-3xl p-5 border"><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">${[["Low Stock","triangle-alert"],["Expiry","calendar-clock"],["Payments Due","credit-card"],["System","bell"]].map(x=>`<div class="rounded-2xl bg-slate-50 p-4"><div class="w-10 h-10 rounded-xl bg-white grid place-items-center">${icon(x[1],"w-5 h-5 text-teal-700")}</div><div class="font-black mt-3">${x[0]}</div><div class="text-xs text-slate-500 mt-1">Enabled for Supabase-backed events.</div></div>`).join("")}</div></section>`);
    if(key==="activity")return simpleFeatureView(key,"Activity & Audit","Operational history and security-ready audit center.",`<section class="bg-white rounded-3xl p-6 border"><p class="text-sm text-slate-600">Activity logging is designed to record sale, purchase, stock adjustment, login/session and sensitive administrative actions in Supabase.</p><div class="grid md:grid-cols-3 gap-3 mt-5">${metric("User","Current","user","text-blue-700")}${metric("Store",state.store?.store_name||"—","store","text-teal-700")}${metric("Session","Protected","shield-check","text-emerald-700")}</div></section>`);
    if(key==="staff")return simpleFeatureView(key,"Staff & Permissions","Role-based operational access.",`<section class="bg-white rounded-3xl p-5 border"><div class="grid md:grid-cols-3 gap-4">${[["Store Admin","Full store operations","shield-check"],["Staff","Billing + permitted modules","user"],["Founder","All stores + approvals","crown"]].map(x=>`<div class="border rounded-2xl p-4"><div class="w-10 h-10 rounded-xl bg-teal-50 grid place-items-center">${icon(x[2],"w-5 h-5 text-teal-700")}</div><h3 class="font-black mt-3">${x[0]}</h3><p class="text-sm text-slate-500 mt-1">${x[1]}</p></div>`).join("")}</div><p class="text-xs text-slate-500 mt-4">Actual authorization remains enforced by Supabase RLS/role functions; UI permissions are not the security boundary.</p></section>`);
    if(key==="delivery")return simpleFeatureView(key,"Delivery","COD, pickup and delivery order workspace.",`<section class="bg-white rounded-3xl p-5 border"><form id="deliveryForm" class="grid md:grid-cols-4 gap-3">${field("delivery_customer","Customer","", "text",true)}${field("delivery_phone","Mobile","")}${field("delivery_address","Address","")}${field("delivery_amount","COD Amount",0,"number")}${field("delivery_status","Status","Pending")}</form><p class="text-xs text-slate-500 mt-3">Delivery records should be persisted in a Supabase delivery-orders table with store-scoped RLS.</p></section>`);
    if(key==="documents")return simpleFeatureView(key,"Medicine Documents","Supabase Storage-ready document workspace.",`<section class="bg-white rounded-3xl p-5 border"><input id="medicineDoc" type="file" class="field" accept="image/*,.pdf"><p class="text-xs text-slate-500 mt-3">Use a private Supabase Storage bucket for prescriptions and medicine documents. Never expose service-role keys in this page.</p></section>`);
    if(key==="barcode")return simpleFeatureView(key,"Barcode Center","Barcode-ready inventory workspace.",`<section class="bg-white rounded-3xl p-5 border"><div class="grid md:grid-cols-3 gap-3">${field("barcodeSearch","Search Barcode","")}${field("barcodeMedicine","Medicine","")}${field("barcodeValue","Barcode","")}</div><button id="barcodeSave" class="primary-btn mt-4">Save Barcode to Inventory</button></section>`);
    if(key==="invoice")return simpleFeatureView(key,"Invoice Center","A4 / thermal printing and invoice controls.",`<section class="bg-white rounded-3xl p-5 border"><div class="grid md:grid-cols-3 gap-3">${field("invoiceSize","Template","A4")}${field("invoiceFooter","Footer","Thank you for your purchase.")}${field("invoiceQr","QR / UPI Reference","")}</div><div class="flex flex-wrap gap-2 mt-4"><button data-feature="sale" class="primary-btn">Open POS</button><button class="secondary-btn" onclick="window.print()">Print Current Page</button></div></section>`);
    if(key==="backup")return simpleFeatureView(key,"Backup / Recovery","Supabase-based backup preparation without LocalStorage.",`<section class="bg-white rounded-3xl p-5 border"><div class="grid md:grid-cols-3 gap-3">${metric("Database","Supabase","database","text-blue-700")}${metric("Browser Storage","Disabled","shield-check","text-emerald-700")}${metric("Export","CSV","download","text-teal-700")}</div><p class="text-sm text-slate-500 mt-4">Business records stay in Supabase. Use Reports Center exports for operational CSV copies; full database backup belongs to Supabase project-level backup tooling.</p></section>`);
    if(key==="reminders")return simpleFeatureView(key,"Refill Reminders","Customer refill schedule workspace.",`<section class="bg-white rounded-3xl p-5 border"><form id="reminderForm" class="grid md:grid-cols-4 gap-3">${field("reminder_customer","Customer","")}${field("reminder_mobile","Mobile","")}${field("reminder_medicine","Medicine","")}${field("reminder_date","Next Refill",today(),"date")}</form><p class="text-xs text-slate-500 mt-3">Reminder records can be persisted to Supabase and later connected to notifications.</p></section>`);
    if(key==="bugs")return simpleFeatureView(key,"Bug Monitor","System issue reporting and monitoring.",`<section class="bg-white rounded-3xl p-5 border"><p class="text-sm text-slate-600">The existing BUG button remains active. Reports are stored in Supabase and screenshots use the private bug-screenshots bucket.</p><button class="primary-btn mt-4" onclick="document.querySelector('#bugDrawer')?.classList.remove('translate-x-full')">Open Bug Reporter</button></section>`);
    if(key==="settings")return simpleFeatureView(key,"Store Settings","Business profile and operating preferences.",`<section class="bg-white rounded-3xl p-5 border"><div class="grid md:grid-cols-2 gap-3">${field("storeName","Store Name",state.store?.store_name||"")}${field("ownerName","Owner",state.store?.owner_name||"")}${field("pharmacist","Pharmacist",state.store?.pharmacist_name||"")}${field("gstinSetting","GSTIN",state.store?.gstin||"")}${field("licenseSetting","Drug License",state.store?.drug_license_number||"")}${field("storePhone","Phone",state.store?.phone||"")}</div><p class="text-xs text-slate-500 mt-3">Business profile editing remains protected by the existing Supabase store-admin policy.</p></section>`);
    return moreView();
  }

  async function renderPage(){
    const page=$("#page");if(!page)return;
    page.innerHTML=`<div class="bg-white rounded-3xl p-8 shadow-sm border text-center"><div class="animate-pulse font-bold text-slate-500">Loading module…</div></div>`;
    try{
      const advanced=["returns","finance","credit","gst","medicine","notifications","activity","staff","delivery","documents","barcode","invoice","backup","reminders","bugs","settings","expiry","reorder","reports"];
      if(advanced.includes(state.currentTab))page.innerHTML=await featureView(state.currentTab);
      else if(state.currentTab==="home")page.innerHTML=await homeView();
      else if(state.currentTab==="sale")page.innerHTML=saleView();
      else if(state.currentTab==="inventory")page.innerHTML=inventoryView();
      else if(state.currentTab==="purchase")page.innerHTML=purchaseView();
      else if(state.currentTab==="sales")page.innerHTML=await salesView();
      else if(state.currentTab==="customers")page.innerHTML=await customersView();
      else if(state.currentTab==="suppliers")page.innerHTML=await suppliersView();
      else page.innerHTML=await moreView();
      bindPage();icons();
    }catch(err){console.error(err);page.innerHTML=`<div class="bg-white rounded-3xl p-6 border border-red-200"><h2 class="font-black text-red-700">Module error</h2><p class="text-sm text-slate-600 mt-2">${esc(err?.message||err)}</p><button id="retryModule" class="primary-btn mt-4">Retry</button></div>`;$("#retryModule").onclick=renderPage;}
  }

  // Keep the visible Purchase UI on the requested direct-fill invoice format.
  function purchaseView(){return `<div class="space-y-5"><div><h1 class="text-2xl font-black">Purchase & OCR</h1><p class="text-slate-500">Upload an invoice image/PDF. OCR fills the structured form directly — no raw OCR text box.</p></div><section class="bg-white rounded-3xl p-5 border shadow-sm"><div class="grid xl:grid-cols-2 gap-5"><div><input id="billFile" type="file" accept="image/*,application/pdf" class="w-full border rounded-xl p-3"><button id="runOCR" class="primary-btn w-full mt-3">${icon("scan-line","w-5 h-5") } Scan Purchase Bill / PDF</button><div id="ocrProgress" class="text-sm text-slate-500 mt-3">Select a bill. The result will be filled into the fields and product table.</div></div><div class="grid sm:grid-cols-2 gap-3">${field("stockist_name","Stockist / Supplier Name",state.ocrMeta?.stockist_name||"")}${field("stockist_address","Stockist Address",state.ocrMeta?.stockist_address||"")}${field("license_number","License / DL No.",state.ocrMeta?.license_number||"")}${field("bill_number","Bill / Invoice No.",state.ocrMeta?.bill_number||"")}${field("invoice_date","Invoice Date",state.ocrMeta?.invoice_date||"","date")}${field("received_date","Date of Receive",state.ocrMeta?.received_date||today(),"date")}${field("due_date","Due Date",state.ocrMeta?.due_date||"","date")}${field("gstin","GSTIN",state.ocrMeta?.gstin||"")}${field("email","Mail ID",state.ocrMeta?.email||"","email")}${field("phone","Phone / Mobile",state.ocrMeta?.phone||"")}${field("total_amount","Total Amount",state.ocrMeta?.total_amount||0,"number")}${field("gst_amount","GST Amount",state.ocrMeta?.gst_amount||0,"number")}${field("previous_balance","Previous Balance",state.ocrMeta?.previous_balance||0,"number")}${field("party_payment","Party Payment",state.ocrMeta?.party_payment||0,"number")}</div></div></section><section class="bg-white rounded-3xl p-5 border shadow-sm"><div class="flex items-center justify-between gap-3"><div><h2 class="font-black text-lg">Editable Extracted Rows</h2><p class="text-xs text-slate-500">Invoice-style columns: SL, HSN, MFG, Item, Pack, Qty, Free, Batch, Exp, MRP, Rate, Dis, Tax, GST%, Amount, Net Amt.</p></div><button id="addOcrRow" class="secondary-btn">+ Row</button></div><div class="overflow-auto mt-4"><table class="w-full text-xs min-w-[2300px]"><thead><tr class="border-b bg-slate-50"><th>SL</th><th>HSN</th><th>MFG</th><th>Item Name</th><th>Packing</th><th>Qty</th><th>Free</th><th>Batch</th><th>Exp.</th><th>MRP</th><th>Rate</th><th>Dis</th><th>Tax</th><th>GST%</th><th>Amount</th><th>Net Amt</th><th></th></tr></thead><tbody id="ocrRows"></tbody></table></div><div class="grid sm:grid-cols-4 gap-3 mt-4"><div class="bg-slate-50 rounded-2xl p-3"><div class="text-xs text-slate-500">Rows</div><b id="ocrRowCount">0</b></div><div class="bg-slate-50 rounded-2xl p-3"><div class="text-xs text-slate-500">Amount</div><b id="ocrTaxableTotal">₹0.00</b></div><div class="bg-slate-50 rounded-2xl p-3"><div class="text-xs text-slate-500">GST</div><b id="ocrGstTotal">₹0.00</b></div><div class="bg-slate-50 rounded-2xl p-3"><div class="text-xs text-slate-500">Net</div><b id="ocrNetTotal">₹0.00</b></div></div><button id="savePurchase" class="primary-btn w-full mt-4">Save Purchase & Update Stock</button></section></div>`;}

  function bindPage(){
    if(state.currentTab==="home"){$$('[data-feature]').forEach(b=>b.onclick=()=>{state.currentTab=b.dataset.feature;renderApp();});}
    if(state.currentTab==="more"){$$('[data-feature]').forEach(b=>b.onclick=()=>{state.currentTab=b.dataset.feature;renderApp();});}
    $$('[data-feature]').forEach(b=>b.onclick=()=>{state.currentTab=b.dataset.feature;renderApp();});
    $$('[data-tab-jump]').forEach(b=>b.onclick=()=>{state.currentTab=b.dataset.tabJump;renderApp();});
    if(state.currentTab==="sale"){
      $("#saleSearch")?.addEventListener("input",e=>renderProducts(e.target.value));
      $("#discount")?.addEventListener("input",renderCart);$("#completeSale")?.addEventListener("click",completeSale);$("#saveDraft")?.addEventListener("click",saveDraft);$("#loadDrafts")?.addEventListener("click",loadDrafts);renderProducts();renderCart();
    }
    if(state.currentTab==="inventory"){$("#inventorySearch")?.addEventListener("input",e=>renderInventoryRows(e.target.value));$("#addInventory")?.addEventListener("click",()=>inventoryModal());renderInventoryRows();}
    if(state.currentTab==="purchase")bindPurchase();
    if(state.currentTab==="sales"){$("#salesSearch")?.addEventListener("input",()=>{const q=$("#salesSearch").value.toLowerCase();$$("#salesRows tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none");});$("#salesExport")?.addEventListener("click",async()=>{const r=await sb.from("sales").select("invoice_number,created_at,customer_name,customer_phone,payment_mode,total,gst_total,status").eq("store_id",state.store.id).order("created_at",{ascending:false}).limit(1000);if(!r.error)downloadCSV("MAAJ_sales.csv",[["Invoice","Date","Customer","Mobile","Payment","GST","Total","Status"],...(r.data||[]).map(x=>[x.invoice_number,x.created_at,x.customer_name,x.customer_phone,x.payment_mode,x.gst_total,x.total,x.status])]);});}
    if(state.currentTab==="finance"){$("#expenseForm")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const r=await sb.from("expenses").insert({store_id:state.store.id,category:String(f.get("category")||"General"),description:String(f.get("description")||""),amount:Number(f.get("amount")||0),created_by:state.me.id});if(r.error)toast(r.error.message,"error");else{toast("Expense saved to Supabase.","success");renderPage();}});}
    if(state.currentTab==="reports"){$("#exportSalesReport")?.addEventListener("click",async()=>{const r=await sb.from("sales").select("invoice_number,created_at,customer_name,payment_mode,total,gst_total,status").eq("store_id",state.store.id).limit(5000);if(!r.error)downloadCSV("MAAJ_sales_report.csv",[["Invoice","Date","Customer","Payment","Total","GST","Status"],...(r.data||[]).map(x=>[x.invoice_number,x.created_at,x.customer_name,x.payment_mode,x.total,x.gst_total,x.status])]);});$("#exportPurchaseReport")?.addEventListener("click",async()=>{const r=await sb.from("purchases").select("invoice_number,created_at,supplier_name,total_amount,gst_amount").eq("store_id",state.store.id).limit(5000);if(!r.error)downloadCSV("MAAJ_purchase_report.csv",[["Invoice","Date","Supplier","Total","GST"],...(r.data||[]).map(x=>[x.invoice_number,x.created_at,x.supplier_name,x.total_amount,x.gst_amount])]);});$("#exportExpenseReport")?.addEventListener("click",async()=>{const r=await sb.from("expenses").select("created_at,category,description,amount").eq("store_id",state.store.id).limit(5000);if(!r.error)downloadCSV("MAAJ_expense_report.csv",[["Date","Category","Description","Amount"],...(r.data||[]).map(x=>[x.created_at,x.category,x.description,x.amount])]);});}
    if(state.currentTab==="returns"){$("#salesReturnBtn")?.addEventListener("click",()=>toast("Return workflow ready; invoice/batch validation should be posted through a Supabase return transaction.","info"));$("#purchaseReturnBtn")?.addEventListener("click",()=>toast("Purchase return workflow ready; supplier credit and stock deduction should be posted through Supabase.","info"));}
    if(state.currentTab==="customers"){$("#customerSearch")?.addEventListener("input",()=>{const q=$("#customerSearch").value.toLowerCase();$$("#customerRows tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none");});}
    if(state.currentTab==="suppliers"){$("#supplierSearch")?.addEventListener("input",()=>{const q=$("#supplierSearch").value.toLowerCase();$$("#supplierRows tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none");});}
  }

  // Direct-fill OCR binder. It uses the existing parser/recognizer functions from the master file when available.
  function bindPurchase(){
    let file=null;
    $$('input[name]').forEach(el=>{if(["stockist_name","stockist_address","license_number","bill_number","invoice_date","received_date","due_date","gstin","email","phone","total_amount","gst_amount","previous_balance","party_payment"].includes(el.name)){el.dataset.purchaseMeta=el.name;el.oninput=()=>{state.ocrMeta=state.ocrMeta||{};state.ocrMeta[el.name]=el.value;};}});
    $("#billFile").onchange=e=>{file=e.target.files[0]||null;$("#ocrProgress").textContent=file?`Selected: ${file.name}`:"Select an invoice.";};
    $("#runOCR").onclick=async()=>{if(!file)return toast("Choose an invoice image or PDF first.","error");if(!window.Tesseract)return toast("OCR engine did not load.","error");const btn=$("#runOCR");busy(btn,true,"Scanning…");try{let text="",words=[];if(typeof fileToOcrImages==="function"){const pages=await fileToOcrImages(file);for(let i=0;i<pages.length;i++){const data=await recognizePurchasePage(pages[i]);text+=(i?"\n":"")+(data.text||"");if(data.words)words.push(...data.words);}}else{const data=await window.Tesseract.recognize(file,"eng");text=data.data?.text||"";}state.ocrText=text;state.ocrMeta=typeof parsePurchaseMeta==="function"?parsePurchaseMeta(text):{};state.ocrMeta.received_date=state.ocrMeta.received_date||today();state.ocrRows=typeof parsePurchaseTable==="function"?parsePurchaseTable(text,words):[];$$('[data-purchase-meta]').forEach(el=>el.value=state.ocrMeta[el.dataset.purchaseMeta]??"");renderOcrRows();$("#ocrProgress").textContent=`OCR complete. ${state.ocrRows.length} editable medicine row(s) found.`;}catch(err){console.error(err);toast(err?.message||"OCR failed.","error");$("#ocrProgress").textContent="OCR failed — try a clear, straight invoice.";}finally{busy(btn,false);}};
    $("#addOcrRow").onclick=()=>{state.ocrRows=state.ocrRows||[];state.ocrRows.push({sn:state.ocrRows.length+1,hsn:"",mfg:"",medicine_name:"",packing:"",qty_fr:"1",quantity:1,free_quantity:0,batch_number:"",expiry_date:today(),mrp:0,purchase_rate:0,discount:0,tax:0,gst_percent:0,amount:0,taxable_amount:0,net_amount:0});renderOcrRows();};
    $("#savePurchase").onclick=savePurchase;renderOcrRows();
  }

  function renderOcrRows(){const b=$("#ocrRows");if(!b)return;const rows=state.ocrRows||[];const inp=(i,k,v,type="text",cls="w-24")=>`<input type="${type}" data-ocr="${i}:${k}" value="${esc(v??"")}" class="${cls} border rounded-lg px-2 py-1.5 bg-white">`;b.innerHTML=rows.map((x,i)=>`<tr class="border-b"><td class="py-2 text-center font-bold">${i+1}</td><td>${inp(i,"hsn",x.hsn)}</td><td>${inp(i,"mfg",x.mfg,"text","w-16")}</td><td>${inp(i,"medicine_name",x.medicine_name,"text","w-56")}</td><td>${inp(i,"packing",x.packing,"text","w-24")}</td><td>${inp(i,"quantity",x.quantity,"number","w-16")}</td><td>${inp(i,"free_quantity",x.free_quantity,"number","w-16")}</td><td>${inp(i,"batch_number",x.batch_number,"text","w-28")}</td><td>${inp(i,"expiry_date",validDate(x.expiry_date)?x.expiry_date:"","date","w-32")}</td><td>${inp(i,"mrp",x.mrp,"number","w-20")}</td><td>${inp(i,"purchase_rate",x.purchase_rate,"number","w-20")}</td><td>${inp(i,"discount",x.discount,"number","w-16")}</td><td>${inp(i,"tax",x.tax||0,"number","w-20")}</td><td>${inp(i,"gst_percent",x.gst_percent,"number","w-16")}</td><td>${inp(i,"amount",x.amount||x.taxable_amount||0,"number","w-24")}</td><td>${inp(i,"net_amount",x.net_amount||0,"number","w-24")}</td><td><button data-del-ocr="${i}" class="text-red-600 font-bold">✕</button></td></tr>`).join("")||`<tr><td colspan="17" class="py-10 text-center text-slate-500">No extracted rows. Scan an invoice or add a row.</td></tr>`;$$('[data-ocr]').forEach(el=>el.oninput=e=>{const [i,k]=el.dataset.ocr.split(":");const x=rows[Number(i)];if(!x)return;x[k]=["quantity","free_quantity","mrp","purchase_rate","discount","tax","gst_percent","amount","net_amount"].includes(k)?Number(e.target.value||0):e.target.value;if(k==="amount")x.taxable_amount=x.amount;if(k==="quantity"||k==="free_quantity")x.qty_fr=x.free_quantity?`${x.quantity}+${x.free_quantity}`:String(x.quantity);updateOcrTotals();});$$('[data-del-ocr]').forEach(b=>b.onclick=()=>{rows.splice(Number(b.dataset.delOcr),1);renderOcrRows();});updateOcrTotals();}
  function updateOcrTotals(){const rows=state.ocrRows||[];const amount=rows.reduce((a,x)=>a+Number(x.amount||x.taxable_amount||0),0),gst=rows.reduce((a,x)=>a+Number(x.tax||0),0),net=rows.reduce((a,x)=>a+Number(x.net_amount||0),0);if($("#ocrRowCount"))$("#ocrRowCount").textContent=rows.length;if($("#ocrTaxableTotal"))$("#ocrTaxableTotal").textContent=money(amount);if($("#ocrGstTotal"))$("#ocrGstTotal").textContent=money(gst);if($("#ocrNetTotal"))$("#ocrNetTotal").textContent=money(net);}

  // Keep the existing savePurchase implementation available, but make sure the direct-fill metadata is retained when the table is posted.
  const _legacySavePurchase=savePurchase;
  async function savePurchase(){
    if(!state.ocrRows?.length)return toast("No purchase rows to save.","error");
    const meta=state.ocrMeta||{};
    const valid=state.ocrRows.filter(x=>String(x.medicine_name||"").trim()&&String(x.batch_number||"").trim()&&validDate(x.expiry_date)&&Number(x.quantity||0)>0);
    if(!valid.length)return toast("Verify medicine, batch, expiry and quantity before saving.","error");
    // Use legacy transaction logic, then retain the structured invoice metadata in the existing purchase raw_ocr field.
    const oldText=state.ocrText;state.ocrText=JSON.stringify({invoice_meta:meta,rows:valid,raw_ocr:oldText});
    try{await _legacySavePurchase();}finally{state.ocrText=oldText;}
  }

  document.addEventListener("DOMContentLoaded",boot);
})();
</script>
