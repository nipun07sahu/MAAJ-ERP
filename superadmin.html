<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAAJ PHARMACY — Founder Console</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#f6f8fb}.glass{background:rgba(255,255,255,.8);backdrop-filter:blur(14px)}.hide{display:none!important}</style>
</head>
<body class="text-slate-800">
<!--
Use the SAME SUPABASE SQL schema from index.html.
SECURITY RULE: never place a Supabase service_role key here. Super-admin access is authorized by the profiles.role='superadmin' row plus RLS.
Create the founder's Auth user securely through Supabase Dashboard, then:
insert into public.profiles(id,full_name,mobile,role,status) values('<AUTH-USER-UUID>','Founder','+91XXXXXXXXXX','superadmin','active');
-->
<div id="root"></div><div id="toast" class="fixed top-4 right-4 z-50 hide"></div>
<script>
const SUPABASE_URL="";const SUPABASE_ANON_KEY="";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let session=null,me=null,profiles=[],stores=[],selected=null;
function notify(msg,type='info'){const x=$('#toast');x.innerHTML=`<div class="px-4 py-3 rounded-xl shadow-lg ${type==='error'?'bg-red-600':'bg-slate-950'} text-white">${esc(msg)}</div>`;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),3500)}
function loginView(){ $('#root').innerHTML=`<main class="min-h-screen flex items-center justify-center p-5"><div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-7"><div class="text-sm font-black text-teal-700">MAAJ PHARMACY</div><h1 class="text-3xl font-black mt-2">Founder Console</h1><p class="text-slate-500 mt-1">Restricted to the platform Super-Admin account.</p><form id="login" class="space-y-3 mt-6"><input name="phone" required placeholder="+91 mobile" class="w-full border rounded-xl px-4 py-3"><input name="password" required type="password" class="w-full border rounded-xl px-4 py-3" placeholder="Password"><button class="w-full bg-slate-950 text-white rounded-xl py-3 font-bold">Enter Console</button></form><a href="index.html" class="block text-center mt-4 text-sm font-bold text-slate-600">← Store Login</a></div></main>`;$('#login').onsubmit=doLogin}
async function doLogin(e){e.preventDefault();const f=new FormData(e.target);try{const r=await supabase.auth.signInWithPassword({phone:f.get('phone'),password:f.get('password')});if(r.error)throw r.error;session=r.data.session;const p=await supabase.from('profiles').select('*').eq('id',session.user.id).single();if(p.error)throw p.error;if(p.data.role!=='superadmin'||p.data.status!=='active'){await supabase.auth.signOut();throw new Error('This account is not an active Super-Admin.')}me=p.data;renderConsole();await loadData()}catch(e){notify(e.message,'error')}}
function renderConsole(){ $('#root').innerHTML=`<div class="min-h-screen"><header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"><div><div class="font-black text-xl">Founder Console</div><div class="text-xs text-slate-500">Global pharmacy platform oversight</div></div><div class="flex items-center gap-2"><span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full font-bold">SUPERADMIN</span><button id="logout" class="border rounded-xl p-2"><i data-lucide="log-out"></i></button></div></div></header><main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-5"><div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="metrics"></div><div class="grid lg:grid-cols-[1fr_420px] gap-5"><section class="bg-white rounded-3xl p-5"><div class="flex flex-col sm:flex-row gap-3 justify-between"><div><h2 class="font-black text-xl">Accounts</h2><p class="text-slate-500 text-sm">Approve, reject, block and restore access.</p></div><input id="search" placeholder="Search store, owner, mobile…" class="border rounded-xl px-4 py-2"></div><div class="overflow-auto mt-4"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="py-3">User</th><th>Store</th><th>Role</th><th>Status</th><th>Strikes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><aside id="detail" class="bg-slate-950 text-white rounded-3xl p-5 min-h-[400px]"><div class="text-slate-400">Select an account to inspect.</div></aside></div></main></div>`;$('#logout').onclick=async()=>{await supabase.auth.signOut();loginView()};$('#search').oninput=()=>renderRows($('#search').value);lucide.createIcons()}
async function loadData(){const [p,s]=await Promise.all([supabase.from('profiles').select('*').order('created_at',{ascending:false}),supabase.from('pharmacy_stores').select('*').order('created_at',{ascending:false})]);if(p.error)throw p.error;if(s.error)throw s.error;profiles=p.data||[];stores=s.data||[];renderMetrics();renderRows()}
function renderMetrics(){const a=profiles.filter(x=>x.role==='admin').length,st=profiles.filter(x=>x.role==='staff').length,p=profiles.filter(x=>x.status==='pending_superadmin').length,b=profiles.filter(x=>x.status.includes('blocked')).length;$('#metrics').innerHTML=[['Stores',stores.length,'building-2'],['Admins',a,'shield-check'],['Staff',st,'users'],['Pending / Blocked',p+' / '+b,'triangle-alert']].map(x=>`<div class="glass rounded-2xl p-4 shadow-sm"><i data-lucide="${x[2]}"></i><div class="text-xs text-slate-500 mt-3">${x[0]}</div><div class="text-2xl font-black mt-1">${x[1]}</div></div>`).join('');lucide.createIcons()}
function renderRows(q=''){q=q.toLowerCase();const list=profiles.filter(x=>(x.full_name+' '+x.mobile+' '+x.store_name+' '+x.role+' '+x.status).toLowerCase().includes(q));$('#rows').innerHTML=list.map(x=>`<tr class="border-b"><td class="py-3"><button data-select="${x.id}" class="text-left"><b>${esc(x.full_name||x.mobile)}</b><div class="text-xs text-slate-500">${esc(x.mobile)}</div></button></td><td>${esc(x.store_name||'—')}</td><td>${esc(x.role)}</td><td><span class="px-2 py-1 rounded-full text-xs font-bold ${x.status.includes('blocked')?'bg-red-100 text-red-700':x.status==='active'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${esc(x.status)}</span></td><td>${x.violation_count}</td><td><button data-select="${x.id}" class="text-teal-700 font-bold">Inspect</button></td></tr>`).join('')||'<tr><td colspan="6" class="py-8 text-center text-slate-500">No accounts.</td></tr>';$$('[data-select]').forEach(b=>b.onclick=()=>inspect(b.dataset.select))}
async function inspect(id){selected=profiles.find(x=>x.id===id);if(!selected)return;const st=stores.find(x=>x.id===selected.store_id);let license='';if(st?.drug_license_path){const r=await supabase.storage.from('licenses').createSignedUrl(st.drug_license_path,600);if(!r.error)license=r.data.signedUrl}$('#detail').innerHTML=`<div class="flex justify-between gap-3"><div><div class="text-xs text-slate-400">Account</div><h2 class="text-xl font-black">${esc(selected.full_name||selected.mobile)}</h2><div class="text-sm text-slate-400">${esc(selected.mobile)} • ${esc(selected.role)}</div></div><button id="closeDetail" class="text-slate-400">✕</button></div><div class="mt-5 space-y-2 text-sm"><div><span class="text-slate-400">Store:</span> ${esc(st?.store_name||selected.store_name||'—')}</div><div><span class="text-slate-400">Owner:</span> ${esc(st?.owner_name||selected.owner_name||'—')}</div><div><span class="text-slate-400">Pharmacist:</span> ${esc(st?.pharmacist_name||selected.pharmacist_name||'—')}</div><div><span class="text-slate-400">Drug License:</span> ${esc(st?.drug_license_number||'—')}</div><div><span class="text-slate-400">GSTIN:</span> ${esc(st?.gstin||'—')}</div><div><span class="text-slate-400">Status:</span> ${esc(selected.status)}</div><div><span class="text-slate-400">Strikes:</span> ${selected.violation_count}</div></div>${license?`<a href="${license}" target="_blank" class="block mt-4 underline text-teal-300">Open uploaded license</a>`:''}<div class="grid grid-cols-2 gap-2 mt-5">${['approve','reject','strike','temp','permanent','unblock'].map(a=>`<button data-act="${a}" class="rounded-xl px-3 py-2 text-sm font-bold ${a==='permanent'||a==='reject'?'bg-red-600':'bg-white/10'}">${{approve:'Approve Account',reject:'Reject Account',strike:'Add Strike',temp:'Temporary Block',permanent:'Permanent Block',unblock:'Unblock & Restore'}[a]}</button>`).join('')}</div>`;$('#closeDetail').onclick=()=>$('#detail').innerHTML='<div class="text-slate-400">Select an account to inspect.</div>';$$('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));}
async function action(act){if(!selected)return;try{if(act==='approve'){await update({status:'active',approved_by:me.id,approved_at:new Date().toISOString()})}else if(act==='reject'){await update({status:'rejected'})}else if(act==='strike'){const n=Number(selected.violation_count||0)+1;const status=n>=3?'permanent_blocked':'temporary_blocked';const reason=prompt('Reason for strike:');if(!reason)return;const u=await supabase.from('profiles').update({violation_count:n,status,last_violation_reason:reason,blocked_at:new Date().toISOString(),blocked_until:n<3?new Date(Date.now()+7*864e5).toISOString():null}).eq('id',selected.id);if(u.error)throw u.error;const v=await supabase.from('violations').insert({profile_id:selected.id,store_id:selected.store_id,reported_by:me.id,reason,strike_number:n,action_taken:status});if(v.error)throw v.error}else if(act==='temp'){await update({status:'temporary_blocked',blocked_at:new Date().toISOString(),blocked_until:new Date(Date.now()+7*864e5).toISOString()})}else if(act==='permanent'){await update({status:'permanent_blocked',blocked_at:new Date().toISOString(),blocked_until:null})}else if(act==='unblock'){await update({status:'active',violation_count:0,last_violation_reason:null,blocked_at:null,blocked_until:null})}await loadData();selected=profiles.find(x=>x.id===selected.id);inspect(selected.id);notify('Action completed.','success')}catch(e){notify(e.message,'error')}}
async function update(p){const r=await supabase.from('profiles').update(p).eq('id',selected.id);if(r.error)throw r.error}
async function boot(){if(!SUPABASE_URL||!SUPABASE_ANON_KEY){loginView();notify('Enter Supabase URL and publishable/anon key in this file.','error');return}const r=await supabase.auth.getSession();if(r.data.session){session=r.data.session;const p=await supabase.from('profiles').select('*').eq('id',session.user.id).single();if(!p.error&&p.data.role==='superadmin'&&p.data.status==='active'){me=p.data;renderConsole();loadData();return}}loginView()}
boot();lucide.createIcons();
</script>
</body>
</html>
